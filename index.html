<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day Planner</title>
  <link rel="stylesheet" href="ruled-design-system/tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <h1 id="date" class="date sans-body"></h1>
    <button id="print" class="btn btn--quiet" type="button" title="Export the day as an A4 SVG">
      Print <span id="print-shortcut" class="btn-shortcut sans-time">⌘P</span>
    </button>
  </header>

  <main class="page">
    <section class="todo-section" aria-labelledby="todo-title">
      <div class="paper paper--ruled paper--margin paper--stacked">
        <h2 id="todo-title" class="sheet-title hand-title">To do</h2>
        <div class="task-group-label sans-label">Top priority</div>
        <ul id="todo-priority" class="task-list"></ul>
        <ul id="todo-rest" class="task-list"></ul>
      </div>
      <p class="hint sans-label"><kbd>Enter</kbd> next line · <kbd>Shift</kbd>+<kbd>Enter</kbd> done</p>
    </section>

    <section class="schedule-section" aria-labelledby="schedule-title">
      <div class="paper schedule-sheet">
        <h2 id="schedule-title" class="sheet-title hand-title">Schedule</h2>
        <div id="schedule" class="schedule" tabindex="0" aria-label="Hourly schedule">
          <div id="rows" class="rows">
            <!-- rows are generated by app.js -->
            <span class="row-label row-label-end sans-time">00:00</span>
            <div id="layer" class="layer">
              <div id="now" class="now-line"><span class="sans-time"></span></div>
              <div id="cursor" class="cursor"></div>
            </div>
          </div>
        </div>
      </div>
      <p class="hint sans-label">
        <kbd>0</kbd>–<kbd>9</kbd> jump to hour, twice for +12h · <kbd>-</kbd> 10 · <kbd>=</kbd> 11 ·
        <kbd>↑</kbd><kbd>↓</kbd> 15 min · type to add · <kbd>↓</kbd> extend · <kbd>Enter</kbd> finish ·
        <kbd>Delete</kbd> twice to remove
      </p>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="print.js"></script>
</body>
</html>
