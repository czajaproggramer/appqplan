<!doctype html>
<html>
<head><meta charset="utf-8"><title>Task — preview</title>
<style>body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)} .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head>
<body>
<div id="root"></div>
<script>
var R = window.Ruled, h = React.createElement;
function Demo(){var s=React.useState([{t:'Gym session with Ash',d:true},{t:'Put together portfolio',d:false,m:'14:00'},{t:'Buy new suit',d:false},{t:'Buy new strings — heavy gauge',d:true}]),l=s[0],set=s[1];
return h('div',{style:{maxWidth:460}},h(R.Paper,{stacked:true},l.map(function(x,i){return h(R.Task,{key:i,done:x.d,meta:x.m,onToggle:function(v){var n=l.slice();n[i]=Object.assign({},x,{d:v});set(n);},onDelete:function(){set(l.filter(function(_,j){return j!==i;}));}},x.t);}),h(R.Input,{placeholder:'Add a task…','aria-label':'New task',onKeyDown:function(e){if(e.key==='Enter'&&e.target.value){set(l.concat([{t:e.target.value,d:false}]));e.target.value='';}}})));}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
