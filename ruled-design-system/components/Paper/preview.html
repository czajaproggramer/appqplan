<!doctype html>
<html>
<head><meta charset="utf-8"><title>Paper — preview</title>
<style>body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)} .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head>
<body>
<div id="root"></div>
<script>
var R = window.Ruled, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{maxWidth:420}},h(R.Paper,{stacked:true},h('div',{className:'hand-title',style:{height:48,lineHeight:'48px'}},'Today'),h('div',{className:'hand-task',style:{height:48,lineHeight:'48px'}},'A ruled sheet with a margin line'),h('div',{className:'hand-task',style:{height:48,lineHeight:'48px',color:'var(--ink-muted)'}},'…and more sheets under it'))));
</script>
</body>
</html>
